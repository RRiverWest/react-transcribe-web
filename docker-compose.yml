services:
  app:
    image: node:24-alpine
    ports:
      - "80:80"
    user: "1000:1000"
    volumes:
      - ./app/:/home/node/app
    working_dir: /home/node/app
    command: npm run dev

    tty: true

  api:
    image: node:24-alpine
    ports:
      - "3001:3001"
    user: "1000:1000"
    volumes:
      - ./api/:/home/node/api
      - $HOME/.aws:/home/node/.aws
    working_dir: /home/node/api
    command: npm run dev

    tty: true
