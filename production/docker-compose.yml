services:
  app:
    build:
      context: ..
      dockerfile: production/Dockerfile-app
      args:
        # Vite はビルド時に VITE_* を埋め込むため build.args で渡す。
        # React は api のオリジン (Cloudflare Tunnel の api 用ドメイン等) へ
        # 直接接続する。必ず api の公開 URL を指定すること。
        # 例: VITE_SOCKET_URL=https://api.example.com
        - VITE_SOCKET_URL=https://transcribe.rriverwest.net
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - transcribe-net

  api:
    build:
      context: ..
      dockerfile: production/Dockerfile-api
    expose:
      - "3001"
    environment:
      - PORT=3001
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      # 一時認証情報 (aws configure export-credentials で取得)。
      # ホストの環境変数 or ../api/.env から注入する。
      # 注意: 一時認証情報は数時間で失効する。失効したら再取得して更新すること。
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - LANGUAGE_CODE=${LANGUAGE_CODE:-ja-JP}
      - MEDIA_SAMPLE_RATE=${MEDIA_SAMPLE_RATE:-44100}
      # Bedrock 要約設定。BEDROCK_REGION 未指定なら AWS_REGION を流用。
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      - BEDROCK_REGION=${BEDROCK_REGION:-}
      - SUMMARY_MIN_CHARS=${SUMMARY_MIN_CHARS:-200}
      # React は別オリジン (app 用ドメイン) から接続するため、
      # そのオリジンを指定する。例: CORS_ORIGIN=https://app.example.com
      # カンマ区切りで複数指定可。'*' で全許可。
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    env_file:
      - path: ../api/.env
        required: false
    # volumes:
    #   - ${HOME}/.aws:/home/node/.aws:ro
    restart: unless-stopped
    networks:
      - transcribe-net

networks:
  transcribe-net:
    external: true
